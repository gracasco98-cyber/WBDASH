events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;
  server_tokens   off;

  # ── Upstream services ──────────────────────────────────────────────────────
  upstream backend  { server backend:3001;  keepalive 16; }
  upstream frontend { server frontend:3000; keepalive 16; }

  server {
    listen 80;
    server_name dashboard.example.com localhost _;

    # ── Timeout per SSE / long-poll ────────────────────────────────────────────
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 10s;

    # ── Header comuni (passati a tutti gli upstream) ───────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ── SSE — stream in tempo reale (no buffer, timeout altissimo) ─────────────
    location /api/sse {
      proxy_pass         http://backend;
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 86400s;
      add_header         X-Accel-Buffering no;
    }

    # ── Backend API + webhooks ─────────────────────────────────────────────────
    location /api {
      proxy_pass      http://backend;
      proxy_buffering off;
      proxy_cache     off;
    }

    location /webhooks {
      proxy_pass      http://backend;
      proxy_buffering off;
    }

    location /health {
      proxy_pass http://backend;
    }

    # ── Next.js static assets — aggressive cache (content-hashed filenames) ────
    location /_next/static/ {
      proxy_pass       http://frontend;
      add_header       Cache-Control "public, max-age=31536000, immutable";
      access_log       off;
    }

    # ── Frontend Next.js HTML — never cache (always fresh after deploy) ─────────
    location / {
      proxy_pass          http://frontend;
      proxy_set_header    Upgrade    $http_upgrade;
      proxy_set_header    Connection "upgrade";
      # Prevent browser & proxy caching of HTML pages so deploys are instant
      add_header          Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header          Pragma       "no-cache"                              always;
    }
  }
}
