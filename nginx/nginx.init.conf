# Minimal HTTP-only config used ONLY to get the first TLS certificate via certbot standalone.
# After 02-init-ssl.sh completes, this file is no longer used.
worker_processes 1;
events { worker_connections 256; }

http {
  server_tokens off;

  server {
    listen 80;
    server_name dashboard.example.com;

    # Certbot standalone occupies port 80 directly for the initial challenge,
    # so this config is only a placeholder — do not start nginx while certbot is running.
    location / {
      return 200 "nginx init placeholder";
      add_header Content-Type text/plain;
    }
  }
}
