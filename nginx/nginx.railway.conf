worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  keepalive_timeout 65;

  # ── Security — hide nginx version ─────────────────────────────────────────
  server_tokens off;

  # ── Gzip ──────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json
             application/javascript application/xml+rss
             application/atom+xml image/svg+xml;

  # ── Upstream services — Railway private network ───────────────────────────
  upstream backend {
    server wbdash.railway.internal:3001;
    keepalive 32;
  }

  upstream frontend {
    server frontend.railway.internal:3000;
    keepalive 32;
  }

  # ── HTTP server ─────────────────────────────────────────────────────────
  # TLS is terminated at Railway's edge proxy; this container only ever
  # receives plain HTTP on the port Railway routes the custom domain to.
  server {
    listen 8080;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';"
      always;

    # ── Request size limit ───────────────────────────────────────────────────
    client_max_body_size 10m;

    # ── SSE — real-time stream (no buffer, very long timeout) ────────────────
    location /api/sse {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 86400s;
      add_header         X-Accel-Buffering no;
    }

    # ── Backend: API + webhooks ───────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    location /webhooks/ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 30s;
    }

    location /health {
      proxy_pass         http://backend/health;
      proxy_set_header   Host $host;
      access_log         off;
    }

    # ── Next.js static assets — aggressive cache (content-hashed names) ───────
    location /_next/static/ {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      add_header         Cache-Control "public, max-age=31536000, immutable";
      access_log         off;
    }

    # ── Frontend: Next.js HTML — never cache (always fresh after deploy) ───────
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_read_timeout 60s;
      add_header         Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header         Pragma        "no-cache"                             always;
    }
  }
}
